<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Perisai Diri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <nav class="bg-red-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center max-w-5xl">
            <h1 class="text-xl font-bold flex items-center gap-2"><span class="text-2xl">🛡️</span> Perisai Diri</h1>
            <div id="nav-menu" class="flex gap-2">
                <button id="btn-show-login" class="bg-white text-red-700 px-4 py-2 rounded font-bold shadow hover:bg-gray-100">Masuk</button>
                <button id="btn-logout" class="bg-black text-white px-4 py-2 rounded font-semibold hover:bg-gray-900 hidden">Keluar</button>
            </div>
        </div>
    </nav>

    <!-- Tab Menu Khusus Admin -->
    <div id="admin-tabs" class="bg-white shadow border-b border-gray-200 hidden sticky top-[68px] z-40">
        <div class="container mx-auto max-w-5xl flex overflow-x-auto">
            <button onclick="switchTab('berita')" id="tab-berita" class="tab-btn px-6 py-3 font-bold text-red-700 border-b-4 border-red-700 whitespace-nowrap">📝 Berita & Info</button>
            <button onclick="switchTab('siswa')" id="tab-siswa" class="tab-btn px-6 py-3 font-bold text-gray-500 border-b-4 border-transparent hover:text-red-700 whitespace-nowrap">👥 Data Siswa</button>
            <button onclick="switchTab('absensi')" id="tab-absensi" class="tab-btn px-6 py-3 font-bold text-gray-500 border-b-4 border-transparent hover:text-red-700 whitespace-nowrap">📅 Jurnal & Absensi</button>
        </div>
    </div>

    <div class="container mx-auto p-4 mt-6 max-w-5xl">
        <div id="alert-box" class="hidden mb-6 p-3 rounded font-bold text-white text-center shadow-lg"></div>

        <!-- ========================================== -->
        <!-- HALAMAN 1: BERITA                          -->
        <!-- ========================================== -->
        <div id="section-berita">
            <div id="auth-section" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow border-t-4 border-red-600 mb-10 text-center">
                <h2 class="text-2xl font-bold mb-2">Portal Pelatih & Pengurus</h2>
                <button id="btn-login-google" class="mt-4 flex items-center justify-center gap-3 bg-white border-2 border-gray-200 text-gray-700 px-4 py-3 rounded-lg w-full font-bold hover:bg-gray-50 shadow-sm">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6 h-6" alt="Google">
                    Lanjutkan dengan Google
                </button>
            </div>

            <div id="dashboard-berita" class="hidden mb-10 bg-white p-8 rounded-xl shadow border-l-4 border-red-600">
                <h2 class="text-2xl font-bold text-red-700 mb-4">Tulis Berita Baru</h2>
                <input type="hidden" id="edit-id" value="">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <input type="text" id="judul-berita" placeholder="Judul Berita" class="w-full p-3 border rounded">
                    <input type="text" id="tag-berita" placeholder="Kategori/Tag" class="w-full p-3 border rounded">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">Unggah Foto Utama</label>
                        <input type="file" id="foto-berita" accept="image/*" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">Status</label>
                        <select id="status-berita" class="w-full p-3 border rounded font-bold">
                            <option value="publish">Publikasikan</option>
                            <option value="draft">Simpan ke Draft</option>
                        </select>
                    </div>
                </div>
                <div class="mb-4 bg-white"><div id="editor-container" class="h-48 rounded-b"></div></div>
                <button id="btn-simpan-berita" class="bg-red-600 text-white px-6 py-2 rounded font-bold shadow hover:bg-red-700">Simpan Berita</button>
            </div>

            <h2 class="text-2xl font-bold mb-4 border-l-4 border-black pl-3 mt-4">Portal Informasi</h2>
            <div id="berita-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <!-- ========================================== -->
        <!-- HALAMAN 2: DATA SISWA & EXPORT/IMPORT      -->
        <!-- ========================================== -->
        <div id="section-siswa" class="hidden">
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-blue-600 mb-8">
                <h2 class="text-xl font-bold mb-4 text-blue-800">Daftarkan Siswa Baru</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <input type="text" id="nama-siswa" placeholder="Nama Lengkap Siswa" class="w-full p-3 border rounded">
                    
                    <!-- Input Tingkatan Fleksibel (Bisa ketik atau pilih) -->
                    <input type="text" id="sabuk-siswa" list="opsi-sabuk" placeholder="Ketik atau Pilih Tingkatan" class="w-full p-3 border rounded">
                    <datalist id="opsi-sabuk">
                        <option value="Dasar 1 (Putih)">
                        <option value="Dasar 2 (Hitam)">
                        <option value="Keluarga (Merah)">
                    </datalist>

                    <input type="text" id="ranting-siswa" placeholder="Nama Ranting / Tempat" class="w-full p-3 border rounded">
                </div>
                <button id="btn-simpan-siswa" class="bg-blue-600 text-white px-6 py-2 rounded font-bold shadow hover:bg-blue-700">Tambahkan Siswa</button>
            </div>

            <div class="flex justify-between items-end mb-4 flex-wrap gap-3">
                <h3 class="text-xl font-bold">Daftar Anggota Siswa</h3>
                <div class="flex gap-2">
                    <button id="btn-export-siswa" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-bold shadow flex items-center gap-1 text-sm">📥 Ekspor CSV</button>
                    <input type="file" id="file-import-siswa" accept=".csv" class="hidden">
                    <button onclick="document.getElementById('file-import-siswa').click()" class="bg-blue-800 hover:bg-blue-900 text-white px-4 py-2 rounded font-bold shadow flex items-center gap-1 text-sm">📤 Impor CSV</button>
                </div>
            </div>
            
            <div class="bg-white rounded-xl shadow overflow-hidden">
                <table class="min-w-full text-left border-collapse">
                    <thead class="bg-gray-800 text-white">
                        <tr>
                            <th class="py-3 px-4 uppercase font-semibold text-sm">Nama Lengkap</th>
                            <th class="py-3 px-4 uppercase font-semibold text-sm">Tingkatan</th>
                            <th class="py-3 px-4 uppercase font-semibold text-sm">Ranting</th>
                            <th class="py-3 px-4 uppercase font-semibold text-sm text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-siswa" class="text-gray-700 divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- HALAMAN 3: JURNAL LATIHAN & ABSENSI        -->
        <!-- ========================================== -->
        <div id="section-absensi" class="hidden">
            
            <!-- Form Input Latihan -->
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-green-600 mb-8">
                <h2 class="text-xl font-bold text-green-800 mb-4">Catat Jurnal Latihan & Absensi Baru</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="font-bold text-gray-700 block mb-1">Tanggal Latihan</label>
                        <input type="date" id="tanggal-absen" class="w-full p-3 border rounded font-bold text-gray-700">
                    </div>
                    <div>
                        <label class="font-bold text-gray-700 block mb-1">Foto Latihan (Opsional)</label>
                        <input type="file" id="foto-latihan" accept="image/*" class="w-full p-2 border rounded">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="font-bold text-gray-700 block mb-1">Materi & Kegiatan Latihan</label>
                    <textarea id="materi-latihan" placeholder="Tulis rincian kegiatan (Misal: Fisik lari 15 menit, Materi tendangan sabit...)" class="w-full p-3 border rounded h-24"></textarea>
                </div>

                <h3 class="font-bold text-gray-800 mb-3 border-b pb-2">Checklist Kehadiran Siswa</h3>
                <div class="overflow-x-auto mb-6">
                    <table class="min-w-full text-left border-collapse">
                        <tbody id="tabel-absensi" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
                
                <div class="flex justify-end">
                    <button id="btn-simpan-absen" class="bg-green-600 text-white px-8 py-3 rounded-lg font-bold shadow-lg hover:bg-green-700 flex items-center gap-2">✅ Simpan Jurnal & Absensi</button>
                </div>
            </div>

            <!-- Riwayat Latihan (Tampil di bawah) -->
            <div class="flex justify-between items-end mb-4 border-t pt-8">
                <h3 class="text-2xl font-bold border-l-4 border-green-600 pl-3">Riwayat Latihan</h3>
                <button id="btn-export-absen" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-bold shadow text-sm">📥 Download Laporan Excel</button>
            </div>
            
            <div id="riwayat-absensi-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, getDoc, setDoc, deleteDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ==========================================
        // 1. MASUKKAN API KEY IMGBB DI SINI
        // ==========================================
        const IMGBB_API_KEY = "ecee7bbedc9bf7d2541dfb76f8e8087d";

        // ==========================================
        // 2. MASUKKAN FIREBASE CONFIG ANDA DI SINI
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyC7vHRm7AhY8fNdvClgDOCl4jevVFMAujY",
            authDomain: "perisai-diri-cabang-bojonegoro.firebaseapp.com",
            projectId: "perisai-diri-cabang-bojonegoro",
            messagingSenderId: "66914647335",
            appId: "1:66914647335:web:fba82b00a83a52b9bcfd02"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentUserRole = 'user';
        let dataSiswaGlobal = []; 

        const quill = new Quill('#editor-container', { theme: 'snow', placeholder: 'Tulis isi berita di sini...' });

        function showAlert(msg, isSuccess = true) {
            const box = document.getElementById('alert-box');
            box.textContent = msg;
            box.className = `mb-6 p-4 rounded-lg font-bold text-white text-center shadow-lg block ${isSuccess ? 'bg-green-600' : 'bg-red-600'}`;
            box.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        // ==========================================
        // SISTEM TAB NAVIGASI
        // ==========================================
        window.switchTab = (tabName) => {
            document.getElementById('section-berita').classList.add('hidden');
            document.getElementById('section-siswa').classList.add('hidden');
            document.getElementById('section-absensi').classList.add('hidden');
            document.getElementById(`section-${tabName}`).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-red-700', 'text-red-700');
                btn.classList.add('border-transparent', 'text-gray-500');
            });
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.remove('border-transparent', 'text-gray-500');
            activeBtn.classList.add('border-red-700', 'text-red-700');

            if(tabName === 'siswa') loadSiswa();
            if(tabName === 'absensi') {
                loadFormAbsensi();
                loadRiwayatAbsensi();
            }
        };

        // ==========================================
        // AUTHENTICATION
        // ==========================================
        document.getElementById('btn-login-google').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const userRef = doc(db, 'users', result.user.uid);
                const userSnap = await getDoc(userRef);
                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        uid: result.user.uid, nama: result.user.displayName, email: result.user.email,
                        role: 'admin_ranting', tanggal_daftar: serverTimestamp()
                    });
                }
                showAlert("Login Berhasil!");
            } catch (error) { showAlert("Gagal Login", false); }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('btn-show-login').classList.add('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                
                const userRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userRef);
                currentUserRole = userSnap.exists() ? userSnap.data().role : 'user';

                const allowed = ['admin_berita', 'admin_ranting', 'admin_cabang', 'pelatih'];
                if (allowed.includes(currentUserRole)) {
                    document.getElementById('admin-tabs').classList.remove('hidden');
                    document.getElementById('dashboard-berita').classList.remove('hidden');
                }
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('btn-show-login').classList.remove('hidden');
                document.getElementById('btn-logout').classList.add('hidden');
                document.getElementById('admin-tabs').classList.add('hidden');
                document.getElementById('dashboard-berita').classList.add('hidden');
                switchTab('berita');
            }
            loadBerita();
        });

        // ==========================================
        // FITUR DATA SISWA & IMPORT/EXPORT
        // ==========================================
        document.getElementById('btn-simpan-siswa').addEventListener('click', async () => {
            const nama = document.getElementById('nama-siswa').value;
            const sabuk = document.getElementById('sabuk-siswa').value;
            const ranting = document.getElementById('ranting-siswa').value;

            if(!nama || !sabuk || !ranting) return showAlert("Semua kolom siswa harus diisi!", false);
            document.getElementById('btn-simpan-siswa').textContent = "Menyimpan...";

            try {
                await addDoc(collection(db, "siswa"), { nama, sabuk, ranting, timestamp: serverTimestamp() });
                showAlert("Siswa berhasil ditambahkan!");
                document.getElementById('nama-siswa').value = '';
                document.getElementById('sabuk-siswa').value = '';
                loadSiswa();
            } catch (e) { showAlert("Gagal menyimpan siswa", false); }
            document.getElementById('btn-simpan-siswa').textContent = "Tambahkan Siswa";
        });

        async function loadSiswa() {
            const tbody = document.getElementById('tabel-siswa');
            const q = query(collection(db, "siswa"), orderBy("nama", "asc"));
            const snapshot = await getDocs(q);
            tbody.innerHTML = '';
            dataSiswaGlobal = [];

            if(snapshot.empty) return tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center">Belum ada data siswa.</td></tr>';

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                dataSiswaGlobal.push({ id: docSnap.id, nama: data.nama, sabuk: data.sabuk, ranting: data.ranting });
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b">
                        <td class="py-3 px-4 font-bold text-gray-800">${data.nama}</td>
                        <td class="py-3 px-4">${data.sabuk}</td>
                        <td class="py-3 px-4">${data.ranting}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="window.hapusSiswa('${docSnap.id}')" class="text-sm bg-red-100 text-red-700 px-3 py-1 rounded hover:bg-red-200">Hapus</button>
                        </td>
                    </tr>`;
            });
        }

        window.hapusSiswa = async (id) => {
            if(confirm("Yakin hapus siswa ini?")) {
                await deleteDoc(doc(db, "siswa", id));
                showAlert("Siswa dihapus.");
                loadSiswa();
            }
        };

        // EXPORT SISWA CSV
        document.getElementById('btn-export-siswa').addEventListener('click', () => {
            let csv = "Nama Lengkap,Tingkatan,Ranting\n";
            dataSiswaGlobal.forEach(s => { csv += `"${s.nama}","${s.sabuk}","${s.ranting}"\n`; });
            downloadCSV(csv, 'Data_Siswa_Perisai_Diri.csv');
        });

        // IMPORT SISWA CSV
        document.getElementById('file-import-siswa').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                const lines = event.target.result.split('\n');
                let count = 0;
                showAlert("Memproses file Impor...", true);
                for(let i=1; i<lines.length; i++){
                    const cols = lines[i].split(',');
                    if(cols.length >= 3){
                        const nama = cols[0].replace(/"/g, '').trim();
                        const sabuk = cols[1].replace(/"/g, '').trim();
                        const ranting = cols[2].replace(/"/g, '').trim();
                        if(nama) {
                            await addDoc(collection(db, "siswa"), { nama, sabuk, ranting, timestamp: serverTimestamp() });
                            count++;
                        }
                    }
                }
                showAlert(`Berhasil mengimpor ${count} data siswa!`);
                e.target.value = ''; // Reset file input
                loadSiswa();
            };
            reader.readAsText(file);
        });

        // ==========================================
        // FITUR JURNAL & ABSENSI LATIHAN
        // ==========================================
        document.getElementById('tanggal-absen').valueAsDate = new Date();

        async function loadFormAbsensi() {
            if(dataSiswaGlobal.length === 0) await loadSiswa(); // Pastikan data siswa ada
            const tbody = document.getElementById('tabel-absensi');
            tbody.innerHTML = '';

            if(dataSiswaGlobal.length === 0) return tbody.innerHTML = '<tr><td class="p-6 text-center text-red-500 font-bold">Data siswa kosong. Tambahkan siswa dulu!</td></tr>';

            dataSiswaGlobal.forEach(siswa => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b border-gray-100 flex flex-col md:flex-row md:items-center p-2 md:p-0">
                        <td class="py-2 md:py-4 px-4 w-full md:w-1/3">
                            <div class="font-bold text-gray-800 text-lg">${siswa.nama}</div>
                            <div class="text-xs text-gray-500">${siswa.sabuk} | Ranting: ${siswa.ranting}</div>
                        </td>
                        <td class="py-2 md:py-4 px-4 w-full md:w-2/3">
                            <div class="flex gap-2 flex-wrap">
                                <label class="cursor-pointer flex-1 text-center">
                                    <input type="radio" name="absen_${siswa.id}" value="Hadir" checked class="peer sr-only">
                                    <div class="px-2 py-2 rounded font-bold border-2 border-gray-200 peer-checked:bg-green-500 peer-checked:text-white peer-checked:border-green-500">Hadir</div>
                                </label>
                                <label class="cursor-pointer flex-1 text-center">
                                    <input type="radio" name="absen_${siswa.id}" value="Sakit" class="peer sr-only">
                                    <div class="px-2 py-2 rounded font-bold border-2 border-gray-200 peer-checked:bg-yellow-400 peer-checked:text-white peer-checked:border-yellow-400">Sakit</div>
                                </label>
                                <label class="cursor-pointer flex-1 text-center">
                                    <input type="radio" name="absen_${siswa.id}" value="Izin" class="peer sr-only">
                                    <div class="px-2 py-2 rounded font-bold border-2 border-gray-200 peer-checked:bg-blue-400 peer-checked:text-white peer-checked:border-blue-400">Izin</div>
                                </label>
                                <label class="cursor-pointer flex-1 text-center">
                                    <input type="radio" name="absen_${siswa.id}" value="Alpha" class="peer sr-only">
                                    <div class="px-2 py-2 rounded font-bold border-2 border-gray-200 peer-checked:bg-red-500 peer-checked:text-white peer-checked:border-red-500">Alpha</div>
                                </label>
                            </div>
                        </td>
                    </tr>`;
            });
        }

        document.getElementById('btn-simpan-absen').addEventListener('click', async () => {
            const tanggal = document.getElementById('tanggal-absen').value;
            const materi = document.getElementById('materi-latihan').value;
            const fotoFile = document.getElementById('foto-latihan').files[0];
            
            if(!tanggal) return showAlert("Pilih tanggal absen terlebih dahulu!", false);
            
            let rekapAbsensi = [];
            dataSiswaGlobal.forEach(siswa => {
                const opsi = document.querySelector(`input[name="absen_${siswa.id}"]:checked`);
                rekapAbsensi.push({ siswa_id: siswa.id, nama: siswa.nama, status: opsi ? opsi.value : "Alpha" });
            });

            const btn = document.getElementById('btn-simpan-absen');
            btn.textContent = "Menyimpan ke Database...";
            btn.disabled = true;

            try {
                let fotoUrl = "";
                // Upload Foto Latihan ke ImgBB jika ada
                if (fotoFile) {
                    btn.textContent = "Mengunggah Foto Latihan...";
                    const formData = new FormData();
                    formData.append("image", fotoFile);
                    const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                    const imgbbResult = await imgbbRes.json();
                    if(imgbbResult.success) fotoUrl = imgbbResult.data.url;
                }

                btn.textContent = "Merekap Absensi...";
                await addDoc(collection(db, "absensi"), {
                    tanggal: tanggal,
                    materi: materi,
                    fotoUrl: fotoUrl,
                    pencatat: currentUser.displayName,
                    data_kehadiran: rekapAbsensi,
                    timestamp: serverTimestamp()
                });
                
                showAlert("Jurnal & Absensi berhasil disimpan!");
                document.getElementById('materi-latihan').value = '';
                document.getElementById('foto-latihan').value = '';
                loadFormAbsensi(); 
                loadRiwayatAbsensi();
            } catch (e) { showAlert("Gagal menyimpan absensi.", false); }
            
            btn.innerHTML = "✅ Simpan Jurnal & Absensi";
            btn.disabled = false;
        });

        async function loadRiwayatAbsensi() {
            const container = document.getElementById('riwayat-absensi-container');
            const q = query(collection(db, "absensi"), orderBy("tanggal", "desc"));
            const snapshot = await getDocs(q);
            container.innerHTML = snapshot.empty ? '<p class="text-gray-500 italic">Belum ada riwayat latihan.</p>' : '';

            snapshot.forEach(docSnap => {
                const d = docSnap.data();
                let h=0, s=0, i=0, a=0;
                d.data_kehadiran.forEach(k => {
                    if(k.status === 'Hadir') h++; else if(k.status === 'Sakit') s++; else if(k.status === 'Izin') i++; else a++;
                });

                const imgHtml = d.fotoUrl ? `<img src="${d.fotoUrl}" class="w-full h-40 object-cover rounded mt-3 border border-gray-200">` : '';
                
                container.innerHTML += `
                    <div class="bg-white border rounded-xl p-5 shadow-sm hover:shadow transition">
                        <div class="flex justify-between items-start mb-2">
                            <div class="font-bold text-lg text-green-700">📅 ${d.tanggal}</div>
                            <button onclick="window.hapusAbsensi('${docSnap.id}')" class="text-xs text-red-500 hover:text-red-700 font-bold">Hapus</button>
                        </div>
                        <div class="text-sm text-gray-500 mb-2">Pencatat/Pelatih: <span class="font-bold text-gray-700">${d.pencatat}</span></div>
                        <div class="text-sm text-gray-700 bg-gray-50 p-3 rounded mb-3 border">
                            <span class="font-bold block mb-1">Materi & Kegiatan:</span>
                            ${d.materi ? d.materi.replace(/\n/g, '<br>') : '<span class="italic text-gray-400">Tidak ada catatan materi</span>'}
                        </div>
                        <div class="grid grid-cols-4 gap-2 text-center text-xs font-bold mb-2">
                            <div class="bg-green-100 text-green-700 p-2 rounded">Hadir: ${h}</div>
                            <div class="bg-yellow-100 text-yellow-700 p-2 rounded">Sakit: ${s}</div>
                            <div class="bg-blue-100 text-blue-700 p-2 rounded">Izin: ${i}</div>
                            <div class="bg-red-100 text-red-700 p-2 rounded">Alpha: ${a}</div>
                        </div>
                        ${imgHtml}
                    </div>`;
            });
        }

        window.hapusAbsensi = async (id) => {
            if(confirm("Yakin ingin menghapus jurnal absensi ini?")) {
                await deleteDoc(doc(db, "absensi", id));
                showAlert("Jurnal absensi dihapus.");
                loadRiwayatAbsensi();
            }
        };

        // EXPORT ABSENSI CSV
        document.getElementById('btn-export-absen').addEventListener('click', async () => {
            let csv = "Tanggal Latihan,Pelatih,Materi,Nama Siswa,Status Kehadiran\n";
            const q = query(collection(db, "absensi"), orderBy("tanggal", "desc"));
            const snapshot = await getDocs(q);
            snapshot.forEach(docSnap => {
                const d = docSnap.data();
                const materiBersih = d.materi ? d.materi.replace(/\n/g, ' - ').replace(/"/g, "'") : '';
                d.data_kehadiran.forEach(k => {
                    csv += `"${d.tanggal}","${d.pencatat}","${materiBersih}","${k.nama}","${k.status}"\n`;
                });
            });
            downloadCSV(csv, 'Laporan_Absensi_Perisai_Diri.csv');
        });

        function downloadCSV(csvContent, fileName) {
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', fileName);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // ==========================================
        // BERITA (Kode yang sudah ada)
        // ==========================================
        document.getElementById('btn-simpan-berita').addEventListener('click', async () => {
            const idEdit = document.getElementById('edit-id').value;
            const judul = document.getElementById('judul-berita').value;
            const tag = document.getElementById('tag-berita').value;
            const status = document.getElementById('status-berita').value;
            const isi = quill.root.innerHTML;
            const fotoFile = document.getElementById('foto-berita').files[0];

            if(!judul || quill.getText().trim().length === 0) return showAlert("Judul dan isi tidak boleh kosong", false);
            
            const btn = document.getElementById('btn-simpan-berita');
            btn.textContent = "Memproses..."; btn.disabled = true;

            try {
                let fotoUrl = ""; 
                if (fotoFile) {
                    const formData = new FormData(); formData.append("image", fotoFile);
                    const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                    const imgbbResult = await imgbbRes.json();
                    if(imgbbResult.success) fotoUrl = imgbbResult.data.url;
                }

                const dataBerita = { judul, tag, isi, status, penulis: currentUser.displayName, tanggal: new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }) };
                if(fotoUrl) dataBerita.fotoUrl = fotoUrl;

                if (idEdit) {
                    dataBerita.diperbarui = serverTimestamp();
                    await updateDoc(doc(db, "berita", idEdit), dataBerita);
                    showAlert("Berita diperbarui!");
                } else {
                    dataBerita.timestamp = serverTimestamp();
                    await addDoc(collection(db, "berita"), dataBerita);
                    showAlert("Berita dipublikasi!");
                }
                
                document.getElementById('edit-id').value = ''; document.getElementById('judul-berita').value = '';
                document.getElementById('foto-berita').value = ''; document.getElementById('tag-berita').value = '';
                quill.setContents([]); loadBerita();
            } catch (e) { showAlert("Gagal menyimpan berita", false); }
            btn.textContent = "Simpan Berita"; btn.disabled = false;
        });

        async function loadBerita() {
            const container = document.getElementById('berita-container');
            const q = query(collection(db, "berita"), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            container.innerHTML = snapshot.empty ? '<p class="text-gray-500 italic">Belum ada berita.</p>' : '';

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const allowed = ['admin_berita', 'admin_ranting', 'admin_cabang', 'pelatih'];
                if (data.status === 'draft' && !allowed.includes(currentUserRole)) return;

                const tagBadge = data.tag ? `<span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded border">${data.tag}</span>` : '';
                const draftBadge = data.status === 'draft' ? `<span class="bg-yellow-500 text-white text-xs px-2 py-1 rounded">DRAFT</span>` : '';
                const fotoHTML = data.fotoUrl ? `<img src="${data.fotoUrl}" class="w-full h-48 object-cover border-b">` : '';

                container.innerHTML += `
                    <div class="bg-white border rounded-xl overflow-hidden shadow-sm flex flex-col">
                        ${fotoHTML}
                        <div class="p-5 flex-1">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-xl text-gray-900">${data.judul}</h3>
                                ${draftBadge}
                            </div>
                            <div class="flex items-center gap-2 mb-4">
                                <span class="text-xs text-gray-500">📅 ${data.tanggal} (Oleh ${data.penulis})</span>
                                ${tagBadge}
                            </div>
                            <div class="text-gray-700 text-sm prose max-w-none line-clamp-4">${data.isi}</div> 
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
